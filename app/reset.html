<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور — AnyDesire.Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1000px 600px at 85% -10%, rgba(168, 85, 247, 0.18), transparent 60%),
        radial-gradient(800px 500px at 0% 110%, rgba(37, 99, 235, 0.14), transparent 55%),
        var(--bg) #09080f;
      color: #f4f1fa; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; padding: 24px;
    }
    .reset-card {
      width: min(420px, 100%); background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
      padding: 32px 28px; backdrop-filter: blur(16px);
    }
    .reset-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; margin-bottom: 22px; text-decoration: none; color: inherit; }
    .reset-brand img { width: 26px; height: 26px; }
    .reset-card h1 { font-size: 1.3rem; margin: 0 0 8px; }
    .reset-card p { margin: 0 0 22px; color: #a29cb3; font-size: 0.9rem; line-height: 1.7; }
    .fl-field { position: relative; margin-bottom: 16px; }
    .fl-field input { width: 100%; box-sizing: border-box; height: 48px; padding: 14px 14px 0; font-family: inherit; font-size: 0.95rem; color: #f4f1fa; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; outline: none; transition: border-color 0.2s ease; }
    .fl-field input:focus, .fl-field input:not(:placeholder-shown) { border-color: #a970ff; }
    .fl-field input:focus + label, .fl-field input:not(:placeholder-shown) + label { transform: translateY(-4px); font-size: 0.72rem; color: #a970ff; }
    .fl-field label { position: absolute; right: 14px; top: 14px; color: #9a93ab; font-size: 0.9rem; pointer-events: none; transition: transform 0.2s ease, font-size 0.2s ease, color 0.2s ease; }
    .fl-field.has-error input { border-color: #f87171; }
    .error-msg { display: none; margin: 6px 4px 0; color: #fca5a5; font-size: 0.78rem; }
    .fl-field.has-error .error-msg { display: block; }
    .btn { width: 100%; height: 48px; border: none; border-radius: 12px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #09080f; background: linear-gradient(135deg, #6e3cbc, #a970ff); }
    .btn[disabled] { opacity: 0.6; pointer-events: none; }
    .form-alert { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 16px; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; text-align: center; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.35); color: #fecaca; }
    .form-alert.is-success { background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.35); color: #bbf7d0; }
  </style>
</head>
<body data-auth="none">
  <div class="reset-card">
    <a class="reset-brand" href="/" aria-label="AnyDesire">
      <img alt="" aria-hidden="true" src="https://anydesire.dev/icon-only.svg">
      <span>AnyDesire</span>
    </a>
    <div id="resetView">
      <h1>جارٍ التحقق من الرابط...</h1>
      <p>نفحص رابط الاستعادة الآن.</p>
    </div>
    <div class="form-alert" id="resetAlert" role="alert" hidden></div>
  </div>

  <script type="module">
    import { supabase } from '../assets/js/supabase-client.js';

    const view = document.getElementById('resetView');
    const alertEl = document.getElementById('resetAlert');

    function showAlert(message, isSuccess) {
      alertEl.textContent = message;
      alertEl.classList.toggle('is-success', Boolean(isSuccess));
      alertEl.hidden = false;
    }

    function renderSetPassword() {
      view.innerHTML = ''
        + '<h1>كلمة مرور جديدة</h1>'
        + '<p>أدخل كلمة مرور جديدة لحسابك.</p>'
        + '<div class="fl-field" id="pwField">'
        + '<input type="password" id="newPassword" placeholder=" " autocomplete="new-password" aria-describedby="pwError">'
        + '<label for="newPassword">كلمة المرور الجديدة</label>'
        + '<div class="error-msg" id="pwError">كلمة المرور 6 أحرف على الأقل</div>'
        + '</div>'
        + '<button type="button" class="btn" id="applyBtn">تحديث كلمة المرور</button>';

      const input = document.getElementById('newPassword');
      const button = document.getElementById('applyBtn');
      const field = document.getElementById('pwField');
      const apply = async () => {
        if (input.value.length < 6) {
          field.classList.add('has-error');
          return;
        }
        field.classList.remove('has-error');
        button.disabled = true;
        const { error } = await supabase.auth.updateUser({ password: input.value });
        if (error) {
          button.disabled = false;
          showAlert('تعذّر تحديث كلمة المرور: ' + error.message);
          return;
        }
        view.innerHTML = '<h1>تم التحديث بنجاح</h1><p>كلمة مرورك الجديدة جاهزة. سجّل دخولك الآن.</p>'
          + '<a href="./index.html" class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">تسجيل الدخول</a>';
        showAlert('', true);
        alertEl.hidden = true;
      };
      button.addEventListener('click', apply);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });
    }

    function renderInvalid() {
      view.innerHTML = '<h1>رابط غير صالح</h1>'
        + '<p>هذا الرابط منتهٍ أو غير صحيح. اطلب رابط استعادة جديدًا من صفحة تسجيل الدخول.</p>'
        + '<a href="./index.html" class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">العودة لتسجيل الدخول</a>';
    }

    (async function boot() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const recoveryToken = params.get('access_token');
      if (!recoveryToken) {
        const { data } = await supabase.auth.getSession();
        if (data.session) { window.location.replace('./home.html'); return; }
        renderInvalid();
        return;
      }
      const { error } = await supabase.auth.setSession({
        access_token: recoveryToken,
        refresh_token: params.get('refresh_token') || '',
      });
      if (error) { renderInvalid(); return; }
      renderSetPassword();
    })();
  </script>
</body>
</html>
