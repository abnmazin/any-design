<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القوالب — AnyDesire.Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #09080f;
      --bg-secondary: #100d1a;
      --bg-soft: #171225;
      --text: #f4f1fa;
      --muted: #a8a1b8;
      --border: #2a2438;
      --border-strong: #463a5c;
      --accent: #a970ff;
      --accent-strong: #c18aff;
      --accent-dim: #a970ff1f;
      --accent-border: #a970ff61;
      --purple-deep: #6e3cbc;
      --danger: #e07a8a;
      --danger-dim: #e07a8a1f;
      --success: #73c69a;
      --success-dim: #73c69a1f;
      --text-secondary: #c7c0d9;
      --text-tertiary: #a9a2c0;
      --skeleton: rgba(244, 241, 250, 0.18);
      --skeleton-strong: rgba(244, 241, 250, 0.34);
      --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)), var(--bg-secondary);
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ===== HEADER ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px clamp(20px, 4vw, 48px);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .brand .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent-dim); border: 1px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
    }
  .brand .logo-icon i { font-size: 0.95rem; color: var(--accent-strong); }
  .brand .brand-icon { width: 30px; height: 30px; display: block; object-fit: contain; flex: 0 0 30px; }
  .brand span { font-size: 1.02rem; font-weight: 700; direction: ltr; }

    .main-nav { display: flex; align-items: center; gap: 4px; }
    .main-nav a {
      font-size: 0.9rem; font-weight: 500; color: var(--muted);
      padding: 9px 16px; border-radius: 100px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .main-nav a:hover { color: var(--text); }
    .main-nav a.active { color: var(--text); background: var(--bg-soft); }
    .main-nav a:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    .header-search {
      flex: 1;
      max-width: 340px;
      position: relative;
    }
    .header-search i {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.85rem; color: var(--muted);
    }
    .header-search input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 40px 10px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .header-search input::placeholder { color: var(--muted); }
    .header-search input:focus { border-color: var(--accent-border); box-shadow: 0 0 0 4px var(--accent-dim); }

    .header-actions { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .icon-btn-sm {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn-sm:hover { background: var(--bg-soft); color: var(--text); border-color: var(--border-strong); }
    .icon-btn-sm:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--purple-deep));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 700; color: #09080f;
      cursor: pointer;
    }
    .avatar:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    /* ===== HERO / WELCOME ===== */
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(44px, 6vw, 72px) clamp(20px, 4vw, 48px) clamp(34px, 4vw, 48px);
      background: linear-gradient(180deg, rgba(16, 13, 26, 0.2), rgba(16, 13, 26, 0.72));
    }
    .hero .mesh {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 45%),
        radial-gradient(circle at 90% 100%, color-mix(in srgb, var(--purple-deep) 22%, transparent), transparent 50%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; }
    .hero h1 { font-size: clamp(1.5rem, 2.4vw, 1.9rem); font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
    .hero p { font-size: 0.95rem; color: rgba(255, 255, 255, 0.62); margin-bottom: 22px; }

    .stat-chips { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat-chip {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 22px;
    }
    .stat-chip i { font-size: 1.15rem; color: var(--accent-strong); }
    .stat-chip .num { font-size: 1.7rem; font-weight: 800; color: var(--text); line-height: 1.1; }
    .stat-chip .lbl { font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); }

    /* ===== SECTION SHELL ===== */
    .section {
      padding: clamp(28px, 4vw, 44px) clamp(20px, 4vw, 48px) 72px;
      margin-bottom: 0;
      background: linear-gradient(180deg, rgba(16, 13, 26, 0.72), rgba(9, 8, 15, 0.96) 28%, var(--bg) 100%);
    }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      background: rgba(23, 18, 37, 0.62);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      background: transparent; border: 1px solid transparent;
      border-radius: 12px; padding: 9px 17px;
      font-size: 0.82rem; font-weight: 500; color: var(--muted);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .pill:hover { color: var(--text); border-color: var(--border-strong); }
    .pill.active {
      background: rgba(168, 85, 247, 0.16); color: #d8b4fe;
      border-color: rgba(168, 85, 247, 0.3); font-weight: 600;
    }
    .pill:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    /* ===== TEMPLATE GRID ===== */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: clamp(18px, 2vw, 24px);
      padding-top: 4px;
    }
    .is-hidden { display: none; }

    .tpl-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }
    .tpl-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
    }

    .tpl-preview {
      position: relative;
      height: 176px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      isolation: isolate;
    }
    .tpl-thumbnail {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1200px;
      height: 630px;
      border: 0;
      border-radius: 10px;
      background: var(--bg-secondary);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.24);
      transform-origin: center;
      opacity: 0.94;
    }
    .tpl-thumbnail.portrait {
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%) scale(0.085);
    }
    .tpl-thumbnail.landscape {
      width: 1200px;
      height: 630px;
      transform: translate(-50%, -50%) scale(0.24);
    }
    .tpl-preview .device-tag {
      position: absolute; top: 10px; right: 10px; z-index: 3;
      font-size: 0.62rem; font-weight: 600; padding: 4px 10px; border-radius: 100px;
      background: color-mix(in srgb, var(--bg) 65%, transparent);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; gap: 5px;
      color: var(--text);
    }

    .tpl-overlay {
      position: absolute; inset: 0;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      opacity: 0; transition: opacity 0.2s ease;
      z-index: 5;
    }
    .tpl-card:hover .tpl-overlay, .tpl-card:focus-within .tpl-overlay { opacity: 1; }

    .overlay-btn {
      border: none; border-radius: 100px; padding: 9px 16px;
      font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      transition: transform 0.15s ease;
    }
    .overlay-btn:hover { transform: scale(1.05); }
    .overlay-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .overlay-btn.primary { background: var(--accent); color: #09080f; }
    .overlay-btn.ghost { background: color-mix(in srgb, var(--bg) 40%, transparent); border: 1px solid var(--border-strong); color: var(--text); }
    .overlay-btn.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
    .overlay-btn.danger:hover { background: var(--danger); color: #09080f; }

    .tpl-info { padding: 14px 16px; }
    .tpl-info .tpl-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .tpl-info .tpl-meta { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-tertiary); }
    .tpl-info .tpl-meta .cat-tag { padding: 2px 8px; border-radius: 100px; font-weight: 600; }

    /* Mini mockups built from CSS to represent preview content */
    .mock-laptop { width: 78%; }
    .mock-laptop-body { background: #050308; border: 1.5px solid var(--skeleton-strong); border-radius: 8px 8px 2px 2px; padding: 6px; }
    .mock-laptop-inner { border-radius: 4px; aspect-ratio: 16/10; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .mock-laptop-base { height: 5px; width: 106%; margin-right: -3%; border-radius: 0 0 4px 4px; border: 1.5px solid var(--skeleton-strong); border-top: none; }

    .mock-phone { width: 34%; }
    .mock-phone-body { background: #050308; border: 1.5px solid var(--skeleton-strong); border-radius: 14px; padding: 5px; aspect-ratio: 9/18; }
    .mock-phone-inner { border-radius: 10px; height: 100%; padding: 8px 5px; display: flex; flex-direction: column; gap: 4px; }
    .mock-bar { height: 4px; border-radius: 3px; background: var(--skeleton); }

    /* ===== DESIGNS SECTION ===== */
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-head h2 { font-size: 1.1rem; font-weight: 700; }
    .section-head h2 i { margin-left: 8px; }
    .section-sub { font-size: 0.82rem; color: var(--text-tertiary); }

    .design-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: clamp(18px, 2vw, 24px);
      padding-top: 4px;
    }
    .design-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }
    .design-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
    }
    .design-preview {
      position: relative; height: 176px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: var(--bg-secondary);
    }
    .design-preview img { max-width: 82%; max-height: 100%; border-radius: 8px; box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35); }
    .design-preview .no-thumb { color: var(--text-tertiary); font-size: 0.78rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .design-preview .no-thumb i { font-size: 1.4rem; color: var(--accent); }
    .design-info { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .design-info .design-title { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .design-info .design-meta { font-size: 0.72rem; color: var(--text-tertiary); }
    .design-actions { display: flex; gap: 8px; }
    .design-actions .design-open {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 10px; border-radius: 100px; font-size: 0.77rem; font-weight: 600;
      background: var(--accent-dim); color: #d8b4fe; border: 1px solid var(--accent-border);
      transition: background 0.15s ease;
    }
    .design-actions .design-open:hover { background: rgba(168, 85, 247, 0.28); }
    .design-actions .design-delete { border: none; background: transparent; color: var(--muted); font-size: 0.82rem; padding: 7px 9px; border-radius: 8px; transition: color 0.15s ease, background 0.15s ease; }
    .design-actions .design-delete:hover { color: var(--danger); background: var(--danger-dim); }

    .empty-designs { margin-top: 8px; padding: 40px 20px; text-align: center; color: var(--muted); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: 18px; }
    .empty-designs i { margin-left: 6px; color: var(--accent); }
    .empty-designs a { color: var(--accent-strong); font-weight: 600; }

    /* ===== AVATAR MENU ===== */
    .avatar-wrap { position: relative; }
    .avatar-menu {
      position: absolute; top: calc(100% + 10px); left: 0;
      min-width: 210px;
      background: var(--bg-secondary);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 8px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.35);
      z-index: 60;
    }
    .avatar-menu .menu-user { display: block; padding: 8px 10px; font-size: 0.82rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar-menu .menu-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: transparent; color: var(--muted); font-size: 0.82rem; border-radius: 10px; text-align: right; cursor: pointer; }
    .avatar-menu .menu-btn:hover { background: var(--danger-dim); color: var(--danger); }

    @media (max-width: 720px) {
      .main-nav, .header-search { display: none; }
      .header-actions .icon-btn-sm { display: none; }
    }
  </style>
</head>
<body data-auth="required">

  <header class="site-header">
    <a class="brand" href="/" aria-label="AnyDesire">
      <img class="brand-icon" alt="" aria-hidden="true" src="https://anydesire.dev/icon-only.svg">
      <span>AnyDesire</span>
    </a>

    <nav class="main-nav">
      <a href="#templates" class="active">القوالب</a>
      <a href="#designs">تصاميمي</a>
    </nav>

    <div class="header-search">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="ابحث عن قالب أو تصميم...">
    </div>

    <div class="header-actions">
      <button class="icon-btn-sm" aria-label="الإشعارات"><i class="fas fa-bell"></i></button>
      <div class="avatar-wrap">
        <div class="avatar" id="userAvatar" tabindex="0" role="button" aria-label="حسابي">…</div>
        <div class="avatar-menu" id="avatarMenu" hidden>
          <span class="menu-user" id="menuUser"></span>
          <button type="button" class="menu-btn" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="mesh"></div>
    <div class="hero-content">
      <h1 id="greeting">أهلًا بعودتك</h1>
      <p>جاهز تصمم حاجة جديدة النهاردة؟</p>
      <div class="stat-chips">
        <div class="stat-chip"><i class="fas fa-shapes"></i><div><div class="num" id="tplCount">0</div><div class="lbl">قالب متاح</div></div></div>
        <div class="stat-chip"><i class="fas fa-folder-open"></i><div><div class="num" id="savedCount">0</div><div class="lbl">تصميم محفوظ</div></div></div>
        <div class="stat-chip"><i class="fas fa-clock-rotate-left"></i><div><div class="num" id="draftCount">0</div><div class="lbl">مسودة نشطة</div></div></div>
      </div>
    </div>
  </section>

  <section class="section" id="templates">
    <div class="filter-bar">
      <div class="pill-group">
        <button class="pill active" data-filter="all">الكل</button>
        <button class="pill" data-filter="story">ستوري 9:16</button>
        <button class="pill" data-filter="banner">بانر 16:9</button>
      </div>
    </div>

    <div class="template-grid" id="templateGrid"></div>
  </section>

  <section class="section" id="designs">
    <div class="section-head">
      <h2><i class="fas fa-folder-open" style="color: var(--accent-strong);"></i> تصاميمي</h2>
      <span class="section-sub" id="designsSub"></span>
    </div>
    <div class="design-grid" id="designsGrid"></div>
    <p class="empty-designs" id="designsEmpty" hidden><i class="fas fa-inbox"></i> ما عندك تصاميم محفوظة بعد. افتح أي قالب واضغط «حفظ» في المحرر.<a href="#templates"> استكشف القوالب</a></p>
  </section>

  <script type="module" src="../assets/js/account.js"></script>
  <script>
    (function () {
      var TEMPLATES = [
        { id: 'wedding', name: 'بطاقة زفاف', size: '1080 × 1920', file: '../templates/wedding/wedding.html', tint: '#f43f5e' },
        { id: 'story', name: 'ستوري إعلاني', size: '1080 × 1920', file: '../templates/story/story.html', tint: '#a970ff' },
        { id: 'bento', name: 'Bento Board', size: '1080 × 1500', file: '../templates/bento/bento.html', tint: '#22d3ee' },
        { id: 'debt-ledger', name: 'سجل الديون', size: '900 × 1280', file: '../templates/debt-ledger/studio.html', tint: '#8b7bff' },
        { id: 'windows-1', name: 'Windows 1', size: '1600 × 900', file: '../templates/windows-1/windows-1.html', tint: '#73c69a' },
        { id: 'windows-2', name: 'Windows 2', size: '1600 × 900', file: '../templates/windows-2/windows-2.html', tint: '#e07a8a' },
        { id: 'phone-1', name: 'Phone 1', size: '1080 × 1920', file: '../templates/phone-1/phone-1.html', tint: '#a970ff' },
        { id: 'phone-2', name: 'Phone 2', size: '1080 × 1920', file: '../templates/phone-2/phone-2.html', tint: '#73c69a' }
      ];

      function parseSize(size) {
        var m = size.match(/(\d+)\s*×\s*(\d+)/);
        return { w: parseInt(m[1], 10), h: parseInt(m[2], 10) };
      }

      function ringOf(w, h) {
        if (Math.abs(w / h - 9 / 16) < 0.01) return 'story';
        if (Math.abs(w / h - 16 / 9) < 0.01) return 'banner';
        if (Math.abs(w / h - 1) < 0.01) return 'square';
        return 'other';
      }

      function ratioLabel(w, h) {
        if (Math.abs(w / h - 9 / 16) < 0.01) return '9:16';
        if (Math.abs(w / h - 16 / 9) < 0.01) return '16:9';
        if (Math.abs(w / h - 1) < 0.01) return '1:1';
        return w + '×' + h;
      }

      var RING_NAMES = { story: 'ستوري', banner: 'بانر', square: 'مربع', other: 'قالب' };

      function cardHtml(t) {
        var dims = parseSize(t.size);
        var ring = ringOf(dims.w, dims.h);
        var portrait = dims.h > dims.w;
        var deviceIcon = portrait ? 'fas fa-mobile-screen-button' : 'fas fa-laptop';
        var ratio = ratioLabel(dims.w, dims.h);
        var bg = 'linear-gradient(155deg, color-mix(in srgb, ' + t.tint + ' 14%, transparent), #09080f)';
        var chip = 'background: color-mix(in srgb, ' + t.tint + ' 15%, transparent); color: ' + t.tint;

        var mock = '<iframe class="tpl-thumbnail ' + (portrait ? 'portrait' : 'landscape') + '" src="' + t.file + '" title="معاينة ' + t.name + '" loading="lazy" tabindex="-1" onload="this.contentDocument.head.insertAdjacentHTML(\'beforeend\', \'<style>#editorUI,.preview-toolbar{display:none!important}.editor-page{padding-top:0!important}.canvas-stage,.story-stage,.wedding-stage{height:100vh!important}</style>\')"></iframe>';

        return (
          '<div class="tpl-card" data-id="' + t.id + '" data-size="' + ring + '" data-name="' + t.name.toLowerCase() + '" data-href="' + t.file + '">' +
            '<div class="tpl-preview" style="background:' + bg + '">' +
              '<span class="device-tag"><i class="' + deviceIcon + '" style="color:' + t.tint + '"></i> ' + ratio + '</span>' +
              mock +
              '<div class="tpl-overlay">' +
                '<a class="overlay-btn primary" href="' + t.file + '"><i class="fas fa-pen"></i> استخدم</a>' +
                '<a class="overlay-btn ghost" href="' + t.file + '"><i class="fas fa-eye"></i></a>' +
                '<button type="button" class="overlay-btn danger" data-action="delete" data-id="' + t.id + '" data-name="' + t.name + '"><i class="fas fa-trash-can"></i> حذف</button>' +
              '</div>' +
            '</div>' +
            '<div class="tpl-info">' +
              '<div class="tpl-name">' + t.name + '</div>' +
              '<div class="tpl-meta"><span class="cat-tag" style="' + chip + '">' + RING_NAMES[ring] + '</span><span>' + t.size + '</span></div>' +
            '</div>' +
          '</div>'
        );
      }

      var grid = document.getElementById('templateGrid');
      var pills = document.querySelectorAll('.pill-group .pill');
      var deletedIds = {};

      function visibleTemplates() {
        return TEMPLATES.filter(function (t) { return !deletedIds[t.id]; });
      }

      function renderTemplateGrid() {
        var list = visibleTemplates();
        grid.innerHTML = list.map(cardHtml).join('');
        document.getElementById('tplCount').textContent = list.length;
        reapplyPills();
        applySearch(searchInput.value.trim().toLowerCase());
      }

      function reapplyPills() {
        Array.prototype.slice.call(grid.querySelectorAll('.tpl-card')).forEach(function (c) {
          var pill = null;
          Array.prototype.slice.call(pills).forEach(function (b) { if (b.classList.contains('active')) pill = b; });
          var f = pill ? pill.getAttribute('data-filter') : 'all';
          c.classList.toggle('is-hidden', f !== 'all' && c.getAttribute('data-size') !== f);
        });
      }

      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          pills.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          reapplyPills();
        });
      });

      grid.addEventListener('click', function (e) {
        var del = e.target.closest('[data-action="delete"]');
        if (del) { deleteTemplate(del); return; }
        if (e.target.closest('a')) return;
        var card = e.target.closest('.tpl-card');
        if (card && card.dataset.href) window.location.href = card.dataset.href;
      });

      function deleteTemplate(btn) {
        if (!window.Supabase) return;
        var id = btn.getAttribute('data-id');
        var name = btn.getAttribute('data-name');
        if (!window.confirm('حذف قالب «' + name + '» نهائيًا؟ لا يمكن التراجع عن هذا الحذف.')) return;
        var task = Promise.race([
          window.Supabase.from('deleted_templates').insert({ id: id }),
          new Promise(function (resolve) {
            setTimeout(function () { resolve({ error: { message: 'انتهت المهلة' } }); }, 6000);
          })
        ]);
        task.then(function (res) {
          if (res.error) {
            window.alert('تعذّر حذف القالب. حاول مرة أخرى.');
            return;
          }
          deletedIds[id] = true;
          renderTemplateGrid();
        });
      }

      function loadDeletedTemplates() {
        if (!window.Supabase) { renderTemplateGrid(); return; }
        var task = Promise.race([
          window.Supabase.from('deleted_templates').select('id'),
          new Promise(function (resolve) {
            setTimeout(function () { resolve({ data: [], error: null }); }, 6000);
          })
        ]);
        task.then(function (res) {
          if (!res.error) {
            (res.data || []).forEach(function (row) { deletedIds[row.id] = true; });
          }
          renderTemplateGrid();
        }).catch(function () { renderTemplateGrid(); });
      }

      var searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function () {
        applySearch(searchInput.value.trim().toLowerCase());
      });
      function applySearch(term) {
        Array.prototype.slice.call(grid.querySelectorAll('.tpl-card')).forEach(function (c) {
          var nameHit = (c.getAttribute('data-name') || '').indexOf(term) !== -1;
          c.classList.toggle('is-hidden', Boolean(term) && !nameHit);
        });
        Array.prototype.slice.call(document.querySelectorAll('#designsGrid .design-card')).forEach(function (c) {
          var titleHit = (c.getAttribute('data-title') || '').indexOf(term) !== -1;
          c.classList.toggle('is-hidden', Boolean(term) && !titleHit);
        });
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function formatDate(value) {
        return new Date(value).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
      }

      var designsGrid = document.getElementById('designsGrid');
      function designsChanged(list) {
        document.getElementById('designsSub').textContent = list.length + ' تصميم';
        document.getElementById('designsEmpty').hidden = list.length > 0;
        var weekAgo = Date.now() - 7 * 86400000;
        document.getElementById('savedCount').textContent = list.length;
        document.getElementById('draftCount').textContent = list.filter(function (d) {
          return new Date(d.updated_at).getTime() >= weekAgo;
        }).length;
        designsGrid.innerHTML = list.map(designCardHtml).join('');
      }
      function designCardHtml(d) {
        var thumb = d.thumb
          ? '<img src="' + d.thumb + '" alt="" loading="lazy">'
          : '<span class="no-thumb"><i class="fas fa-pen-nib"></i>لا صورة مصغرة</span>';
        return '<div class="design-card" data-id="' + d.id + '" data-title="' + (d.title || '').toLowerCase() + '">'
          + '<div class="design-preview">' + thumb + '</div>'
          + '<div class="design-info">'
          + '<div class="design-title">' + escapeHtml(d.title) + '</div>'
          + '<div class="design-meta">' + escapeHtml(d.size || 'لمقاس مخصص') + ' · ' + formatDate(d.updated_at) + '</div>'
          + '<div class="design-actions">'
          + '<button type="button" class="design-open" data-action="open"><i class="fas fa-pen"></i> فتح</button>'
          + '<button type="button" class="design-delete" data-action="delete" aria-label="حذف"><i class="fas fa-trash-can"></i></button>'
          + '</div></div></div>';
      }
      function loadDesigns() {
        if (!window.Supabase) return;
        var query = window.Supabase.from('designs')
          .select('id, title, size, thumb, updated_at')
          .order('updated_at', { ascending: false });
        var task = Promise.race([
          query,
          new Promise(function (resolve) { setTimeout(function () { resolve({ data: [], error: null }); }, 6000); })
        ]);
        return task.then(function (res) {
          designsChanged(res.data || []);
        }).catch(function () {
          designsChanged([]);
        });
      }
      designsGrid.addEventListener('click', function (e) {
        var card = e.target.closest('.design-card');
        if (!card || !window.Supabase) return;
        var btn = e.target.closest('button');
        if (!btn || btn.dataset.action === 'open') {
          window.location.href = './design.html?id=' + card.dataset.id;
          return;
        }
        if (btn.dataset.action === 'delete' && window.confirm('حذف هذا التصميم نهائيًا؟')) {
          window.Supabase.from('designs').delete().eq('id', card.dataset.id).then(function (res) {
            if (!res.error) loadDesigns();
          });
        }
      });

      var userAvatar = document.getElementById('userAvatar');
      var avatarMenu = document.getElementById('avatarMenu');
      userAvatar.addEventListener('click', function (e) { e.stopPropagation(); avatarMenu.hidden = !avatarMenu.hidden; });
      userAvatar.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); avatarMenu.hidden = !avatarMenu.hidden; }
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.avatar-wrap')) avatarMenu.hidden = true;
      });
      document.getElementById('logoutBtn').addEventListener('click', function () {
        window.Account.logout();
      });

      // account.js is a deferred module — it defines window.Account right
      // before DOMContentLoaded, so bind the user-rendering block to that event.
      window.addEventListener('DOMContentLoaded', function () {
        window.Account.onReady(function (user) {
          if (!user) return;
          document.getElementById('greeting').textContent = 'أهلًا بعودتك، ' + user.username;
          userAvatar.textContent = user.username.slice(0, 2);
          document.getElementById('menuUser').textContent = user.email || user.username;
          loadDesigns();
          loadDeletedTemplates();
        });
      });
    })();
  </script>

</body>
</html>
