<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميم محفوظ — AnyDesire.Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    body { margin: 0; background: #09080f; }
    .design-stage {
      width: 100%; height: calc(100vh - 60px); min-height: 0;
      padding: 24px 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .design-stage .canvas-wrapper, .design-stage .card-frame { flex: 0 0 auto; }
    #designLoading {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #a8a1b8; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 0.9rem;
    }
    #designLoading i { font-size: 1.4rem; color: #c18aff; }
  </style>
</head>
<body class="editor-page" data-auth="required">
  <div id="designLoading"><i class="fas fa-spinner fa-spin"></i> جارٍ فتح تصميمك...</div>
  <div class="design-stage" id="designStage" hidden></div>
  <script type="module" src="../assets/js/design-boot.js"></script>
</body>
</html>
