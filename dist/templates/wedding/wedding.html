<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف — المركزية الحديثة</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .wedding-stage { display: flex; justify-content: center; padding: 30px 12px 90px; }

    .card-frame {
      width: 1080px; height: 1920px;
      background-color: #e9e9e9;
      padding: 28.8px;
      position: relative;
      box-shadow: 15px 25px 40px rgba(0, 0, 0, 0.35), 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .card-inner {
      background-color: #ffffff;
      width: 100%; height: 100%;
      border: 1px solid #dfdfdf;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 76.8px 32.4px;
      text-align: center; z-index: 10;
    }

    .floral-bg {
      position: absolute; bottom: -20px; left: -20px;
      width: 130%; height: auto; opacity: 0.15; pointer-events: none; z-index: 0;
      transform: rotate(-5deg);
    }

    .content {
      position: relative; z-index: 10; width: 100%;
      display: flex; flex-direction: column; align-items: center; height: 100%;
    }

    .monogram {
      font-family: 'Aref Ruqaa', serif;
      color: #83887b; line-height: 1;
      margin-top: 38.4px; margin-bottom: 134.4px;
      display: flex; justify-content: center; align-items: center; gap: 26px; height: 153.6px;
    }
    .monogram .char-m, .monogram .char-a { font-size: 83.2px; }
    .monogram .char-w { font-size: 47.5px; opacity: 0.7; margin-top: 20px; }

    .dua-banner {
      font-family: 'Aref Ruqaa', serif;
      font-size: 40.4px; color: #83887b;
      margin-bottom: 67.2px; word-spacing: 2px; opacity: 0.9;
    }

    .invitation-text {
      font-size: 35.6px; color: #83887b; line-height: 1.8; font-weight: 500;
      margin-bottom: 96px;
    }

    .main-groom-name {
      position: relative; display: inline-block;
      font-family: 'Aref Ruqaa', serif;
      font-size: 154.4px; font-weight: 400; color: #83887b; line-height: 1;
      margin-bottom: 48px; letter-spacing: -2px; opacity: 0.85;
      text-shadow: 0 0 1px rgba(131, 136, 123, 0.4);
    }
    .main-groom-name::after {
      content: ' ٌ';
      position: absolute; top: -0.45em; left: 50%; transform: translateX(-50%);
      font-size: 0.55em; opacity: 0.9; color: #83887b;
    }

    .inshallah {
      font-size: 33.3px; font-weight: 500; color: #83887b; margin-bottom: 115.2px;
    }

    .details-grid {
      display: flex; justify-content: space-evenly; width: 100%;
      padding: 0 18px; margin-bottom: 115.2px;
    }

    .detail-item { display: flex; flex-direction: column; align-items: center; gap: 24px; flex: 1; }

    .icon-wrapper {
      font-size: 52.3px; color: #83887b; opacity: 0.8;
      height: 45px; display: flex; align-items: center; justify-content: center;
    }

    .detail-item p { font-size: 30.9px; font-weight: 500; color: #83887b; line-height: 1.6; }

    .footer-calligraphy {
      font-family: 'Aref Ruqaa', serif;
      font-size: 66.5px; font-weight: 400; color: #83887b;
      margin-top: 0; opacity: 0.85;
    }

    [] { outline: none; }
    []:focus { box-shadow: inset 0 0 0 2px rgba(131, 136, 123, 0.3); border-radius: 4px; }
  </style>
  <script type="module" crossorigin src="/assets/editor-XE0pj11t.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/site-D5I7T2BU.css">
</head>
<body class="editor-page">

  <div class="preview-toolbar">
    <span class="zoom"><i class="fas fa-arrows-up-down-left-right"></i> دعوة زفاف — 1080 × 1920</span>
    <a href="../../app/home.html#/studio" style="margin-inline-start:16px;" class="btn"><i class="fas fa-arrow-right"></i> رجوع</a>
  </div>

  <div class="wedding-stage">
    <div class="card-frame">
      <div class="card-inner">

        <svg class="floral-bg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#9ea396" stroke-width="0.8" fill="none" stroke-linecap="round">
            <path d="M10,180 C30,120 80,100 120,130 C100,160 50,190 10,180 Z" />
            <path d="M120,130 C160,90 190,40 160,10 C120,30 90,80 120,130 Z" />
            <path d="M10,180 C-10,120 20,70 60,80 C50,130 30,160 10,180 Z" />
            <path d="M60,80 C90,20 150,0 180,30 C140,60 90,80 60,80 Z" />
            <path d="M10,180 C50,150 90,140 120,130" stroke-width="0.5"/>
            <path d="M120,130 C140,80 150,40 160,10" stroke-width="0.5"/>
            <path d="M60,80 C110,40 150,20 180,30" stroke-width="0.5"/>
          </g>
        </svg>

        <div class="content">

          <div class="monogram">
            <span class="char-m">م</span>
            <span class="char-w">و</span>
            <span class="char-a">أ</span>
          </div>

          <div class="dua-banner editable" >
            وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا
          </div>

          <div class="invitation-text editable" >
            على سُنة الله ورسوله يدعوكم <br> الحاج مازن مكي العامري<br>
            لمشاركته بهجة عقد قران ولده
          </div>

          <div class="main-groom-name editable" >
            محمـــد
          </div>

          <div class="inshallah editable" >
            وذلك بمشيئة الله
          </div>

          <div class="details-grid">
            <div class="detail-item">
              <div class="icon-wrapper">
                <i class="fas fa-home"></i>
              </div>
              <p class="editable" >الانطلاق من <br> شارع الميثاق</p>
            </div>

            <div class="detail-item">
              <div class="icon-wrapper">
                <i class="far fa-calendar-alt"></i>
              </div>
              <p class="editable" >يوم الجمعة<br>٤ - ٩ - ٢٠٢٦</p>
            </div>
          </div>

          <div class="footer-calligraphy editable" >
            أفراحنا تكتمل بحضوركم
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/site-settings.js"></script>

</body>
</html>
