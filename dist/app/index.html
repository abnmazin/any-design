<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — المركزية الحديثة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/site-D78fNVxH.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth">
      <a class="brand" href="../index.html"><i class="fas fa-palette"></i> المركزية <b>الحديثة</b></a>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn primary" id="loginBtn"><i class="fas fa-right-to-bracket"></i> دخول</button>

      <p class="alt">لا تملك حساباً؟ <a href="#" onclick="alert('أنشئ حساباً لاحقاً')">أنشئ حساباً</a></p>
      <p class="alt"><a href="../index.html">العودة للرئيسية</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', function () {
      var email = document.getElementById('loginEmail').value.trim();
      var pass = document.getElementById('loginPass').value.trim();
      if (!email || !pass) {
        alert('أدخل البريد وكلمة المرور');
        return;
      }
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
