<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Any Design — AnyDesire.dev</title>
  <meta http-equiv="refresh" content="0; url=./app/home.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #09080f; color: #a8a1b8;
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; font-size: 0.9rem;
    }
    .launch { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .launch .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: rgba(169, 112, 255, 0.14); border: 1px solid rgba(169, 112, 255, 0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .launch .logo-icon i { font-size: 1.3rem; color: #c18aff; }
    .launch a { color: #c18aff; font-weight: 600; text-decoration: none; }
    .launch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="launch">
    <div class="logo-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
    <div>جارٍ فتح مكتبة القوالب…</div>
    <a href="./app/home.html">افتح الآن</a>
  </div>
  <script>location.replace('./app/home.html');</script>

</html>
